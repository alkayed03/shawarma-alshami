<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شاورما الشامي | Shawarma Al-Shami</title>
<style>
  :root {
    --bg:#1f0a08;
    --card:#341310;
    --gold:#f4b247;
    --gold-soft:#ffdca0;
    --red:#c4311f;
    --text:#fff4e6;
    --muted:rgba(255,244,230,.66);
    --line:rgba(255,220,160,.18);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { background:var(--bg); }
  body {
    font-family:"Segoe UI",Tahoma,Arial,sans-serif;
    color:var(--text);
    min-height:100vh;
    display:flex; justify-content:center;
    background:
      radial-gradient(560px 360px at 50% -50px, rgba(196,49,31,.38), transparent 70%),
      var(--bg);
  }
  .wrap { width:100%; max-width:460px; padding:46px 22px 40px; text-align:center; }

  .logo {
    width:184px; height:184px; margin:0 auto;
    border-radius:50%; background:#fff; overflow:hidden;
    border:3px solid var(--gold);
    box-shadow:0 0 0 7px rgba(244,178,71,.16), 0 18px 40px rgba(0,0,0,.5);
  }
  .logo img { width:100%; height:100%; object-fit:cover; display:block; }

  h1 { font-size:30px; font-weight:800; margin-top:24px; }
  .tag { color:var(--gold); font-size:14px; margin-top:6px; letter-spacing:.28em; text-transform:uppercase; direction:ltr; }

  .links { display:flex; flex-direction:column; gap:12px; margin-top:30px; text-align:right; }
  a.btn {
    display:flex; align-items:center; gap:14px;
    padding:15px 18px; border-radius:16px;
    text-decoration:none; font-size:17px; font-weight:600;
    transition:transform .15s, filter .15s;
  }
  a.btn:active { transform:scale(.98); }
  a.btn:hover { filter:brightness(1.07); }
  a.btn .ic {
    width:38px; height:38px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-size:18px; flex:none; font-weight:800;
  }
  a.btn small { display:block; font-size:13px; font-weight:400; margin-top:2px; opacity:.8; }

  a.primary { background:linear-gradient(135deg,#ffc15a,#ee9a22); color:#2a0e08; box-shadow:0 10px 24px rgba(238,154,34,.28); }
  a.primary .ic { background:rgba(42,14,8,.14); }

  a.dark { background:var(--card); color:var(--text); border:1px solid var(--line); }
  a.dark .ic { background:rgba(244,178,71,.16); color:var(--gold); }

  /* صندوق الاقتراحات */
  .suggest {
    margin-top:30px; text-align:right;
    background:var(--card); border:1px solid var(--line);
    border-radius:18px; padding:20px 18px 18px;
  }
  .suggest h2 { font-size:19px; color:var(--gold-soft); }
  .suggest p.hint { font-size:14px; color:var(--muted); margin:6px 0 14px; line-height:1.6; }
  .suggest input, .suggest textarea {
    width:100%; font:inherit; font-size:16px;
    background:rgba(0,0,0,.28); color:var(--text);
    border:1px solid var(--line); border-radius:12px;
    padding:12px 14px; margin-bottom:10px; direction:rtl;
  }
  .suggest textarea { min-height:110px; resize:vertical; }
  .suggest input::placeholder, .suggest textarea::placeholder { color:rgba(255,244,230,.42); }
  .suggest input:focus, .suggest textarea:focus { outline:2px solid var(--gold); border-color:var(--gold); }
  .suggest button {
    width:100%; padding:14px; font:inherit; font-size:17px; font-weight:700;
    border:0; border-radius:14px; cursor:pointer;
    background:linear-gradient(135deg,#ffc15a,#ee9a22); color:#2a0e08;
  }
  .suggest button:disabled { opacity:.6; cursor:default; }
  #msg { margin-top:12px; font-size:15px; min-height:20px; text-align:center; line-height:1.6; }
  #msg.ok { color:#9be3a4; }
  #msg.bad { color:#ff9c8f; }
  .hp { position:absolute; left:-9999px; width:1px; height:1px; opacity:0; }
</style>
</head>

  <form class="suggest" id="form" autocomplete="off">
    <h2>صندوق الاقتراحات</h2>
    <p class="hint">رأيك يهمنا. اكتب اقتراحك أو ملاحظتك وبتوصل لإدارة المحل مباشرة.</p>
    <input type="text" id="name" placeholder="اسمك (اختياري)" maxlength="60">
    <textarea id="suggestion" placeholder="اكتب اقتراحك هنا..." maxlength="1500" required></textarea>
    <input type="text" id="honey" class="hp" tabindex="-1" aria-hidden="true">
    <button type="submit" id="send">إرسال الاقتراح</button>
    <div id="msg" role="status"></div>
  </form>
</div>

<script>
/* ====== الإيميل اللي بتوصل عليه الاقتراحات ====== */
var RECEIVER_EMAIL = "mohammadotoom194@gmail.com";
/* ================================================= */

var form = document.getElementById('form');
var msg = document.getElementById('msg');
var btn = document.getElementById('send');

function show(text, ok) { msg.textContent = text; msg.className = ok ? 'ok' : 'bad'; }

form.addEventListener('submit', function (e) {
  e.preventDefault();
  msg.textContent = ''; msg.className = '';

  if (RECEIVER_EMAIL.indexOf('@') === -1) { show('صندوق الاقتراحات غير مفعّل بعد.', false); return; }
  var text = document.getElementById('suggestion').value.trim();
  if (!text) { show('اكتب اقتراحك أولاً.', false); return; }
  if (document.getElementById('honey').value) { return; }

  btn.disabled = true; btn.textContent = 'جاري الإرسال...';

  fetch('https://formsubmit.co/ajax/' + encodeURIComponent(RECEIVER_EMAIL), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
    body: JSON.stringify({
      'الاسم': document.getElementById('name').value.trim() || 'بدون اسم',
      'الاقتراح': text,
      _subject: 'اقتراح جديد - شاورما الشامي',
      _template: 'table',
      _captcha: 'false'
    })
  })
  .then(function (r) { return r.json(); })
  .then(function (d) {
    if (d && (d.success === 'true' || d.success === true)) {
      form.reset();
      show('وصلنا اقتراحك، شكراً إلك! 🌟', true);
    } else {
      show('صار خطأ بالإرسال، جرّب مرة ثانية.', false);
    }
  })
  .catch(function () { show('تعذّر الإرسال، تأكد من الإنترنت وجرّب مرة ثانية.', false); })
  .then(function () { btn.disabled = false; btn.textContent = 'إرسال الاقتراح'; });
});
</script>
